# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "amazon/nova-lite"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.06
cache = { read = 0.015 }

[cost.text.output]
price = 0.24
